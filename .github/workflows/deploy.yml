name: Deploy to GitHub Pages

on:
  # Despliega al hacer push a la rama main.
  push:
    branches: [main]
  # Permite lanzarlo manualmente desde la pestaña Actions.
  workflow_dispatch:

# Permisos necesarios para publicar en GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Permite un único despliegue concurrente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          # Astro requiere Node >=22.12; usamos Node 24.
          node-version: 24
          # path: .                # raíz del repo
          # package-manager: npm
        env:
          # Claves públicas de Supabase, necesarias en el build (se inyectan en
          # el cliente). Son PUBLIC_*, no secretas.
          PUBLIC_SUPABASE_URL: https://bembimdeybjcozqdlcsq.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: sb_publishable_-L90AVddIKgZ03_PcRHXVw_7_GpogBk

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
