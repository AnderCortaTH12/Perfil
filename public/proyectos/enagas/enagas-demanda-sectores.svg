<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="640" height="340" fill="#fbfaf8" />
  <text x="24" y="34" font-size="16" font-weight="600" fill="#1a1815">Demanda de gas por sector (GWh, último mes)</text>
  <text x="24" y="54" font-size="11" fill="#6b665e">Fuente: Boletín Estadístico del Gas · Enagás — datos extraídos automáticamente</text>

  <!-- axis line -->
  <line x1="200" y1="76" x2="200" y2="300" stroke="#e6e2da" stroke-width="1" />

  <!-- bars: max value 15267 -> scale to 380px max width -->
  <!-- Convencional 15267 -->
  <text x="190" y="104" font-size="12" fill="#1a1815" text-anchor="end">Convencional</text>
  <rect x="200" y="88" width="380" height="28" rx="4" fill="#9a6a4f" />
  <text x="590" y="107" font-size="12" fill="#1a1815">15.267</text>

  <!-- Industrial 13000 -->
  <text x="190" y="154" font-size="12" fill="#1a1815" text-anchor="end">Industrial</text>
  <rect x="200" y="138" width="324" height="28" rx="4" fill="#b98a70" />
  <text x="534" y="157" font-size="12" fill="#1a1815">13.000</text>

  <!-- Sector electrico 8573 -->
  <text x="190" y="204" font-size="12" fill="#1a1815" text-anchor="end">Sector eléctrico</text>
  <rect x="200" y="188" width="213" height="28" rx="4" fill="#c9a68f" />
  <text x="423" y="207" font-size="12" fill="#1a1815">8.573</text>

  <!-- Cisternas 900 -->
  <text x="190" y="254" font-size="12" fill="#1a1815" text-anchor="end">Cisternas</text>
  <rect x="200" y="238" width="23" height="28" rx="4" fill="#dcc4b3" />
  <text x="233" y="257" font-size="12" fill="#1a1815">900</text>

  <line x1="200" y1="300" x2="580" y2="300" stroke="#e6e2da" stroke-width="1" />
  <text x="200" y="320" font-size="10" fill="#6b665e">0</text>
  <text x="580" y="320" font-size="10" fill="#6b665e" text-anchor="end">16.000 GWh</text>
</svg>
